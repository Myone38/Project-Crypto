name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit checks
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fetch base branch to compute changed files
            git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1 || true
            files=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)
            if [ -n "$files" ]; then
              echo "Running pre-commit on changed files:"
              echo "$files"
              echo "$files" | xargs pre-commit run --files
            else
              echo "No changed files to check"
            fi
          else
            # For push or scheduled runs, run a full check to ensure repo-wide consistency
            pre-commit run --all-files
          fi

  lint:
    needs: precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff
        run: |
          ruff check .

  autofix:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff auto-fix
        run: |
          ruff check --fix . || true

      - name: Create PR with fixes (if any)
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply ruff auto-fixes"
          branch: "autofix/ruff-fixes-${{ github.sha }}"
          title: "chore: apply ruff auto-fixes"
          body: "This pull request applies automatic ruff fixes (from CI)."
          labels: "autofix, ci"

  test:
    runs-on: ubuntu-latest
    needs: [precommit, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          # Capture pytest output to a logfile for diagnostics and still exit with pytest status
          coverage run -m pytest -q 2>&1 | tee pytest-output.log
          test_exit=${PIPESTATUS[0]}
          coverage xml -i
          exit $test_exit

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload pytest logs
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: pytest-output.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true
